name: Python-CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Show Python version
        run: python --version

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py"